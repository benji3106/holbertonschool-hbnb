<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
</head>
<body>
    <header>
        <div class="header-logo">
            
            <span class="header-title">EorzeaHBnB</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="create_place.html" id="create-place-link" class="login-button" style="display: none;">Create Place</a>
            <a href="create_user.html" id="admin-link" class="login-button" style="display: none;">Create User</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
            <button id="logout-link" class="login-button" onclick="logout()" style="display: none;">Logout</button>
        </nav>
    </header>

    <main>
        <section id="filter">
            <h2>Filter</h2>
            <label for="price-filter">Max Gil:</label>
            <select id="price-filter">
                <option value="all">All prices</option>
                <option value="10">Up to 10 gil</option>
                <option value="50">Up to 50 gil</option>
                <option value="100">Up to 100 gil</option>
                <option value="150">Up to 150 gil</option>
                <option value="200">Up to 200 gil</option>
                <option value="300">Up to 300 gil</option>
                <option value="500">Up to 500 gil</option>
            </select>

            <label for="region-filter" style="margin-left: 20px;">Region:</label>
            <select id="region-filter">
                <option value="all">All Regions</option>
                <option value="La Noscea">La Noscea</option>
                <option value="The Black Shroud">The Black Shroud</option>
                <option value="Thanalan">Thanalan</option>
                <option value="Coerthas">Coerthas</option>
                <option value="Mor Dhona">Mor Dhona</option>
                <option value="Abalathia">Abalathia</option>
                <option value="Dravania">Dravania</option>
                <option value="Gyr Abania">Gyr Abania</option>
                <option value="Othard">Othard</option>
                <option value="Hingashi">Hingashi</option>
            </select>
        </section>

        <section id="places-list">
            <h2>Available Estates</h2>
        </section>
    </main>

    <footer>
        <p>All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
