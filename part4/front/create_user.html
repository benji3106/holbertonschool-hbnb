<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
</head>
<body>
    <header>
        <div class="header-logo">
            
            <span class="header-title">EorzeaHBnB</span>
        </div>
        <nav>
            <a href="index.html" class="login-button">Home</a>
            <a href="create_place.html" id="create-place-link" class="login-button" style="display: none;">Create Place</a>
            <a href="create_user.html" id="admin-link" class="login-button" style="display: none;">Create User</a>
            <a href="profile.html" id="profile-link" class="login-button" style="display: none;">My Profile</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
            <button id="logout-link" class="login-button" onclick="logout()" style="display: none;">Logout</button>
        </nav>
    </header>

    <main>
        <section class="form-container" id="create-user-section">
            <form id="create-user-form">
                <h2>Create User</h2>

                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>

                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <p id="create-user-message"></p>

                <button type="submit">Create User</button>
            </form>
        </section>
    </main>

    <footer>
        <p>All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
